<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deckly</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="shell">
    <main class="card" id="card">
      <header class="topbar">
        <div class="brand">
          <span class="ico" id="logo"></span>
          <span class="brand-name">Deckly</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-pin" title="Pin panel (stay open across tabs)"></button>
          <button class="icon-btn" id="btn-close" title="Close"></button>
        </div>
      </header>

      <section class="head">
        <h1>My Tasks</h1>
        <div class="head-actions">
          <button class="icon-btn" id="btn-compact" title="Compact / expand"></button>
          <button class="icon-btn" id="btn-more" title="Menu"></button>
        </div>
      </section>

      <button class="addrow" id="btn-add"><span class="ico" id="plus"></span><span>Add task</span></button>

      <section class="list" id="list"></section>

      <footer class="footer" id="footer">
        <button class="done-toggle" id="done-toggle">
          <span id="done-label">Completed (0)</span>
          <span class="ico chev" id="chev"></span>
        </button>
        <div class="done-list" id="done-list"></div>
      </footer>
    </main>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
